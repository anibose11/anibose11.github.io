<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="100%" role="img" aria-labelledby="t2 d2" style="max-width:360px;background:#fcfcfb">
<title id="t2">How name-based matching compares with the NDC crosswalk</title><desc id="d2">Held-out products with a unique RxCUI from package NDCs (n = 1,285).</desc>
<rect width="360" height="230" fill="#fcfcfb"/>
<text x="12.0" y="24.0" font-size="15" fill="#1d1d1b" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">How name-based matching compares with</text>
<text x="12.0" y="42.0" font-size="15" fill="#1d1d1b" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">the NDC crosswalk</text>
<text x="12.0" y="60.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Held-out products with a unique RxCUI from package</text>
<text x="12.0" y="75.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">NDCs (n = 1,285).</text>
<rect x="12.0" y="85" width="10" height="10" rx="2" fill="#2470cc"/>
<text x="26.0" y="94.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Same RxCUI as identifier crosswalk</text>
<rect x="12.0" y="103" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="26.0" y="112.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Different RxCUI</text>
<rect x="138.0" y="103" width="10" height="10" rx="2" fill="#9c9a93"/>
<text x="152.0" y="112.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Several candidates</text>
<rect x="12.0" y="121" width="10" height="10" rx="2" fill="#d6d4cd"/>
<text x="26.0" y="130.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">No match or abstained</text>
<text x="102.0" y="164.0" font-size="12" fill="#1d1d1b" text-anchor="end" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">B: names</text>
<g><title>B: names + attributes: Same RxCUI as identifier crosswalk 1,095 of 1,285 (85.2%)</title><rect x="112.0" y="150" width="192.3" height="20" rx="2" fill="#2470cc"/></g>
<text x="208.1" y="164.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">85%</text>
<g><title>B: names + attributes: Different RxCUI 9 of 1,285 (0.7%)</title><rect x="306.3" y="150" width="0.5" height="20" rx="2" fill="#eb6834"/></g>
<g><title>B: names + attributes: Several candidates 115 of 1,285 (8.9%)</title><rect x="307.9" y="150" width="18.4" height="20" rx="2" fill="#9c9a93"/></g>
<g><title>B: names + attributes: No match or abstained 66 of 1,285 (5.1%)</title><rect x="328.3" y="150" width="9.7" height="20" rx="2" fill="#d6d4cd"/></g>
<text x="102.0" y="200.0" font-size="12" fill="#1d1d1b" text-anchor="end" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">C: approximate</text>
<g><title>C: approximate names: Same RxCUI as identifier crosswalk 478 of 1,285 (37.2%)</title><rect x="112.0" y="186" width="82.8" height="20" rx="2" fill="#2470cc"/></g>
<text x="153.4" y="200.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">37%</text>
<g><title>C: approximate names: Different RxCUI 87 of 1,285 (6.8%)</title><rect x="196.8" y="186" width="13.4" height="20" rx="2" fill="#eb6834"/></g>
<g><title>C: approximate names: No match or abstained 720 of 1,285 (56.0%)</title><rect x="212.2" y="186" width="125.8" height="20" rx="2" fill="#d6d4cd"/></g>
<text x="275.1" y="200.0" font-size="11" fill="#1d1d1b" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">56%</text>
</svg>