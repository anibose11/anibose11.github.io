</style><title id="t">Error before and after the quote-validity rule</title><desc id="d">Dumbbell chart. For each model and context: error among all answers, error among quote-valid answers, and the range of errors from random rejection keeping the same number of answers.</desc><rect width="760" height="404" fill="var(--surface)"/><text class="title" x="16" y="26">Error before and after the quote-validity rule</text><text class="sub" x="16" y="46">Error among retained answers with all answers and with quote and locator valid only, against random rejection.</text><circle cx="22" cy="66" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text class="tick" x="32" y="70">all answers</text><polygon points="130,60 136,71 124,71" fill="var(--ink)"/><text class="tick" x="142" y="70">quote and locator valid only</text><line x1="300" y1="66" x2="330" y2="66" stroke="var(--neutral)" stroke-width="8"/><text class="tick" x="338" y="70">random rejection at the same coverage, middle 95% of 2,000 draws</text><line class="grid" x1="250.0" y1="96" x2="250.0" y2="340"/><text class="tick" x="250.0" y="356" text-anchor="middle">10%</text><line class="grid" x1="322.0" y1="96" x2="322.0" y2="340"/><text class="tick" x="322.0" y="356" text-anchor="middle">20%</text><line class="grid" x1="394.0" y1="96" x2="394.0" y2="340"/><text class="tick" x="394.0" y="356" text-anchor="middle">30%</text><line class="grid" x1="466.0" y1="96" x2="466.0" y2="340"/><text class="tick" x="466.0" y="356" text-anchor="middle">40%</text><line class="grid" x1="538.0" y1="96" x2="538.0" y2="340"/><text class="tick" x="538.0" y="356" text-anchor="middle">50%</text><line class="grid" x1="610.0" y1="96" x2="610.0" y2="340"/><text class="tick" x="610.0" y="356" text-anchor="middle">60%</text><line class="axis" x1="250" y1="340" x2="610" y2="340"/><text class="note" x="430.0" y="374" text-anchor="middle">share of retained answers with the wrong label (axis starts at 10%)</text><text class="lab" x="16" y="117.0">Qwen3-1.7B, retrieved</text><line x1="494.6" y1="113.0" x2="518.6" y2="113.0" stroke="var(--neutral)" stroke-width="8"><title>Random rejection keeping the same number of answers: mean error 45.6%, middle 95% 44.0% to 47.3%</title></line><line x1="506.1" y1="113.0" x2="507.0" y2="113.0" stroke="var(--s1)" stroke-width="2"/><circle cx="506.1" cy="113.0" r="5.0" fill="var(--surface)" stroke="var(--s1)" stroke-width="2"><title>All answers: error 45.6%, coverage 98.9%</title></circle><polygon points="507.0,107.0 513.0,118.0 501.0,118.0" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>Quote and locator valid only: error 45.7%, coverage 72.0%</title></polygon><text class="val" x="622" y="117.0">coverage 99% to 72%</text><text class="lab" x="16" y="151.0">Qwen3-0.6B, retrieved</text><line x1="460.3" y1="147.0" x2="512.6" y2="147.0" stroke="var(--neutral)" stroke-width="8"><title>Random rejection keeping the same number of answers: mean error 42.8%, middle 95% 39.2% to 46.5%</title></line><line x1="486.1" y1="147.0" x2="485.7" y2="147.0" stroke="var(--s2)" stroke-width="2"/><circle cx="486.1" cy="147.0" r="5.0" fill="var(--surface)" stroke="var(--s2)" stroke-width="2"><title>All answers: error 42.8%, coverage 97.0%</title></circle><polygon points="485.7,141.0 491.7,152.0 479.7,152.0" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>Quote and locator valid only: error 42.7%, coverage 37.6%</title></polygon><text class="val" x="622" y="151.0">coverage 97% to 38%</text><text class="lab" x="16" y="185.0">Qwen3-4B-Instruct-2507, retrieved</text><line x1="320.7" y1="181.0" x2="332.6" y2="181.0" stroke="var(--neutral)" stroke-width="8"><title>Random rejection keeping the same number of answers: mean error 20.7%, middle 95% 19.8% to 21.5%</title></line><line x1="327.0" y1="181.0" x2="325.6" y2="181.0" stroke="var(--s3)" stroke-width="2"/><circle cx="327.0" cy="181.0" r="5.0" fill="var(--surface)" stroke="var(--s3)" stroke-width="2"><title>Al