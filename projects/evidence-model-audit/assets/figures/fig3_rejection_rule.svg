<svg xmlns="http://www.w3.org/2000/svg" class="viz-root" width="760" height="404" viewBox="0 0 760 404" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>
