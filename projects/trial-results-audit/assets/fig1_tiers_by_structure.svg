<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="100%" role="img" aria-labelledby="fig-tiers-t fig-tiers-d" style="max-width:760px;height:auto;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="fig-tiers-t">How each outcome group gets its participant denominator</title><desc id="fig-tiers-d">Stacked bars showing the share of applicable held-out outcome groups in tiers A, B and C, overall and by outcome table structure.</desc><rect width="760" height="304" fill="#fcfcfb"/><text x="0" y="18" font-size="15" font-weight="600" fill="#1d1d1b">How each outcome group gets its participant denominator</text><text x="0" y="38" font-size="12.5" fill="#52514e">Held-out confirmed cohort, applicable outcome groups, by the structure of the outcome table.</text><rect x="250" y="52" width="12" height="12" rx="2" fill="#2a78d6"/><text x="267" y="62" font-size="12" fill="#1d1d1b">A: Directly structured</text><rect x="420" y="52" width="12" height="12" rx="2" fill="#eb6834"/><text x="437" y="62" font-size="12" fill="#1d1d1b">B: Explicit rule needed</text><rect x="590" y="52" width="12" height="12" rx="2" fill="#1baf7a"/><text x="607" y="62" font-size="12" fill="#1d1d1b">C: Not safely resolvable</text><text x="240" y="93" font-size="12" text-anchor="end" fill="#1d1d1b">All applicable outcome groups</text><text x="240" y="107" font-size="11" text-anchor="end" fill="#52514e">n = 43,715</text><g><title>All applicable outcome groups, tier A (Directly structured): 37,592 of 43,715 (85.99%)</title><rect x="250.0" y="84.0" width="410.8" height="20.0" fill="#2a78d6"/></g><text x="256.0" y="98" font-size="11" fill="#ffffff">86.0%</text><g><title>All applicable outcome groups, tier B (Explicit rule needed): 6,118 of 43,715 (14.00%)</title><rect x="662.8" y="84.0" width="65.2" height="20.0" fill="#eb6834"/></g><text x="668.8" y="98" font-size="11" fill="#ffffff">14.0%</text><g><title>All applicable outcome groups, t